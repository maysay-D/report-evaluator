[project]
name = "report-evaluator-comparison"
version = "0.1.0"
description = "Baseline and improved NLP systems for evaluating Japanese reports"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
improved = [
    "fugashi>=1.3",
    "ginza>=5.2",
    "ja-ginza>=5.2",
    "sentence-transformers>=3.0",
    "spacy>=3.7",
    "torch>=2.2",
    "transformers>=4.40",
    "unidic-lite>=1.0",
]

[tool.uv]
package = false
